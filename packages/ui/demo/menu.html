<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dropdown menu</title>
    <link rel="stylesheet" href="../src/styles.css" />
    <link rel="stylesheet" href="../src/components/button.css" />
    <link rel="stylesheet" href="../src/components/menu.css" />
    <script>
      const t = new URLSearchParams(location.search).get("theme");
      if (t) document.documentElement.dataset.theme = t;
    </script>
    <style>
      main { max-width: 56rem; margin: 0 auto; padding: var(--space-6) var(--gutter); }
      .row { display: flex; gap: var(--space-8); align-items: flex-start; min-height: 16rem; flex-wrap: wrap; }
      .col { display: flex; flex-direction: column; gap: var(--space-3); }
      .h { color: var(--color-muted); font-size: var(--text-sm); font-weight: 700; }
      .pinned { position: static; margin-block-start: var(--space-2); }
    </style>
  </head>
  <body>
    <main>
      <h1>Dropdown menu</h1>
      <div class="row">
        <div class="col">
          <span class="h">Public (details, no JS): open</span>
          <details class="kc-menu-wrap" open>
            <summary class="kc-menu-trigger">Capstone Capsules</summary>
            <div class="kc-menu">
              <a class="kc-menu__item" href="#">Today’s Capsule</a>
              <a class="kc-menu__item" href="#" style="background: var(--color-hover)">Browse by month</a>
              <a class="kc-menu__item" href="#">Browse by series</a>
            </div>
          </details>
        </div>
        <div class="col">
          <span class="h">Public: closed</span>
          <details class="kc-menu-wrap">
            <summary class="kc-menu-trigger">Capstone Capsules</summary>
            <div class="kc-menu"><a class="kc-menu__item" href="#">Today’s Capsule</a></div>
          </details>
        </div>
        <div class="col">
          <span class="h">Admin (Radix): row actions</span>
          <button class="kc-btn kc-btn--secondary" aria-haspopup="menu" aria-expanded="true">Actions</button>
          <div class="kc-menu pinned" role="menu" data-state="open" style="animation:none">
            <div class="kc-menu__label">Event</div>
            <div class="kc-menu__item" role="menuitem" tabindex="-1">Edit</div>
            <div class="kc-menu__item" role="menuitem" data-highlighted tabindex="-1">Duplicate</div>
            <div class="kc-menu__item" role="menuitem" data-disabled aria-disabled="true">Archive</div>
            <div class="kc-menu__separator" role="separator"></div>
            <div class="kc-menu__item" role="menuitem" data-danger tabindex="-1">Delete</div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
