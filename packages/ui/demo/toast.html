<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toasts</title>
    <link rel="stylesheet" href="../src/styles.css" />
    <link rel="stylesheet" href="../src/components/toast.css" />
    <script>
      const t = new URLSearchParams(location.search).get("theme");
      if (t) document.documentElement.dataset.theme = t;
    </script>
    <style>
      main { max-width: 40rem; margin: 0 auto; padding: var(--space-6) var(--gutter); }
      .stack { position: static; align-items: flex-start; padding: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Toasts</h1>
      <p>Static markup of each variant as rendered by ToastProvider. Success and info dismiss after 4s; errors stay until dismissed.</p>
      <ol class="kc-toast-viewport stack">
        <li class="kc-toast" data-state="open" data-variant="success" style="animation:none"><div class="kc-toast__body"><p class="kc-toast__title">Saved as draft</p></div><button class="kc-toast__close" aria-label="Dismiss"><span aria-hidden="true">×</span></button></li>
        <li class="kc-toast" data-state="open" data-variant="info" style="animation:none"><div class="kc-toast__body"><p class="kc-toast__title">New capsule available</p><p class="kc-toast__description">Today's capsule has been published.</p></div><button class="kc-toast__close" aria-label="Dismiss"><span aria-hidden="true">×</span></button></li>
        <li class="kc-toast" data-state="open" data-variant="error" style="animation:none"><div class="kc-toast__body"><p class="kc-toast__title">Couldn't save</p><p class="kc-toast__description">Check your connection and try again.</p></div><button class="kc-toast__close" aria-label="Dismiss"><span aria-hidden="true">×</span></button></li>
      </ol>
    </main>
  </body>
</html>
