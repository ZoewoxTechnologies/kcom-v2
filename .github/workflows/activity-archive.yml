name: activity-archive

# Keeps the admin activity log small: archives each month once it is 6 months old, then deletes
# months older than 12 months, but only when their archive file exists. Archives go to the same
# bucket as the nightly backup, under activity/. See docs/backups.md.
on:
  schedule:
    - cron: "30 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: activity-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          S3_SERVER_SIDE_ENCRYPTION: ${{ vars.BACKUP_S3_SSE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION || 'auto' }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          missing=""
          for v in DATABASE_URL S3_ENDPOINT S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Activity archive is not configured. Missing:$missing"
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Archive and delete
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          S3_SERVER_SIDE_ENCRYPTION: ${{ vars.BACKUP_S3_SSE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION || 'auto' }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: pnpm --filter @kcom/db db:archive-activity
