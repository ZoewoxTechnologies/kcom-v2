name: Performance audit

# Manual only: run it from the Actions tab against any reachable URL.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to audit, e.g. https://example.org
        required: true
        type: string

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          BASE_URL: ${{ inputs.url }}
        run: pnpm --filter @kcom/web audit:perf
